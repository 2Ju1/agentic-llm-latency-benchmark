model: Qwen/Qwen2.5-1.5B-Instruct
base_url: http://localhost:8000/v1/chat/completions
metrics_urls:
  router: http://localhost:8000/metrics
  prefill: http://localhost:8100/metrics
  decode: http://localhost:8201/metrics

temperature: 0
warmup: true
default_num_steps: 8
default_tool_tokens: 256
default_max_output_tokens: 32

sweeps:
  step_counts: [1, 2, 4, 8, 16, 32]
  tool_tokens: [64, 256, 512, 1024]
  output_tokens: [8, 16, 32, 64, 128]
  tool_latency_seconds: [0, 0.5, 1, 2, 5]
  repeats: 3
  fixed_output_repeats: 5
  output_repeats: 5

